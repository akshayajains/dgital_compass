<line x1="1065" y1="696" x2="1065" y2="804" stroke="#527491" stroke-width="2"/>
<text x="1106" y="705" class="s" font-size="15" font-weight="700" letter-spacing="1.5" fill="#b8cbe0">FEATURE PREMIUM</text>
<text x="1106" y="767" class="s" font-size="43" font-weight="700" fill="#75e3dc">11%–15%</text>
<text x="1106" y="799" class="s" font-size="18" fill="#d2deeb">over ₹2,500 base fan</text>
<rect x="80" y="842" width="1440" height="44" rx="9" fill="#d9e8f2"/>
<rect x="80" y="842" width="8" height="44" rx="4" fill="#55d6ce"/>
<text x="108" y="870" class="s" font-size="18" font-weight="700" fill="#102644">Prototype: ₹3,590 total</text>
<text x="380" y="870" class="s" font-size="16" fill="#284966">₹2,500 base fan + ₹1,090 feature · Scaled estimate assumes 65–75% lower component cost; supplier pricing may vary.</text>
