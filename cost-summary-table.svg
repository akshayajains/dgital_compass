<rect x="80" y="321" width="1440" height="34" fill="#24466d"/><text x="104" y="344">Slave syringes</text><text x="830" y="344" text-anchor="end">3</text><text x="1010" y="344" text-anchor="end">90</text><text x="1190" y="344" text-anchor="end">23–32</text>
<rect x="80" y="355" width="1440" height="34" fill="#2b5278"/><text x="104" y="378">Hydraulic tubing + manifold + connectors</text><text x="830" y="378" text-anchor="end">—</text><text x="1010" y="378" text-anchor="end">200</text><text x="1190" y="378" text-anchor="end">50–70</text>
<rect x="80" y="389" width="1440" height="34" fill="#24466d"/><text x="104" y="412">Master syringe</text><text x="830" y="412" text-anchor="end">1</text><text x="1010" y="412" text-anchor="end">30</text><text x="1190" y="412" text-anchor="end">8–11</text>
<rect x="80" y="423" width="1440" height="34" fill="#2b5278"/><text x="104" y="446">DC motor</text><text x="830" y="446" text-anchor="end">1</text><text x="1010" y="446" text-anchor="end">150</text><text x="1190" y="446" text-anchor="end">38–53</text>
<rect x="80" y="457" width="1440" height="34" fill="#24466d"/><text x="104" y="480">ESP32</text><text x="830" y="480" text-anchor="end">1</text><text x="1010" y="480" text-anchor="end">200</text><text x="1190" y="480" text-anchor="end">50–70</text>
<rect x="80" y="491" width="1440" height="34" fill="#2b5278"/><text x="104" y="514">Lead screw + coupling</text><text x="830" y="514" text-anchor="end">—</text><text x="1010" y="514" text-anchor="end">100</text><text x="1190" y="514" text-anchor="end">25–35</text>
<rect x="80" y="525" width="1440" height="34" fill="#24466d"/><text x="104" y="548">Wiring, mounts, fasteners, etc.</text><text x="830" y="548" text-anchor="end">—</text><text x="1010" y="548" text-anchor="end">100</text><text x="1190" y="548" text-anchor="end">25–35</text>
<rect x="80" y="559" width="1440" height="34" fill="#2b5278"/><text x="104" y="582">Motor driver + limit switches</text><text x="830" y="582" text-anchor="end">—</text><text x="1010" y="582" text-anchor="end">100</text><text x="1190" y="582" text-anchor="end">25–35</text></g>
<rect x="80" y="593" width="1440" height="42" fill="#d9e8f2"/><text x="104" y="621" class="s" font-size="18" font-weight="700" fill="#102644">FEATURE TOTAL</text><text x="1010" y="621" class="s" font-size="19" font-weight="700" fill="#102644" text-anchor="end">1,090</text><text x="1190" y="621" class="s" font-size="19" font-weight="700" fill="#102644" text-anchor="end">272–381</text>
