<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09172d"/><stop offset="1" stop-color="#142f55"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#53d7d0"/><stop offset="1" stop-color="#8be4d1"/></linearGradient>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#020a18" flood-opacity=".28"/></filter>
 <style>.sans{font-family:Arial,Helvetica,sans-serif}</style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1450" cy="140" r="330" fill="#234873" opacity=".17"/>
<circle cx="120" cy="810" r="250" fill="#167c8a" opacity=".09"/>
<rect x="105" y="83" width="9" height="115" rx="4.5" fill="url(#accent)"/>
<text x="144" y="112" class="sans" font-size="17" font-weight="700" letter-spacing="2.5" fill="#69ded7">PROTOTYPE • HYDRAULIC FAN</text>
<text x="144" y="176" class="sans" font-size="48" font-weight="700" fill="#f5f8ff">Cost breakdown</text>
<text x="147" y="215" class="sans" font-size="20" fill="#afc1d9">Itemized parts cost for one prototype</text>
<rect x="1270" y="107" width="220" height="74" rx="18" fill="#173457" stroke="#31567a"/>
<text x="1380" y="136" class="sans" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.4" fill="#afc1d9">TOTAL COST</text>
<text x="1380" y="166" class="sans" text-anchor="middle" font-size="27" font-weight="700" fill="#76e5ce">₹1,090</text>
<!-- table card -->
<rect x="100" y="267" width="1400" height="584" rx="19" fill="#102644" stroke="#35577a" stroke-width="1.5" filter="url(#shadow)"/>
<path d="M119 267 H1481 Q1500 267 1500 286 V333 H100 V286 Q100 267 119 267Z" fill="#245076"/>
<text x="143" y="309" class="sans" font-size="16" font-weight="700" letter-spacing="1.3" fill="#e7f4ff">ITEM</text>
<text x="1190" y="309" class="sans" font-size="16" font-weight="700" letter-spacing="1.3" fill="#e7f4ff" text-anchor="middle">QTY</text>
<text x="1320" y="309" class="sans" font-size="16" font-weight="700" letter-spacing="1.3" fill="#e7f4ff" text-anchor="end">COST (₹)</text>
<!-- rows -->
<g class="sans" font-size="21" fill="#f2f6fc">
 <rect x="101" y="333" width="1398" height="46" fill="#132c4b"/><text x="143" y="363">Microfiber</text><text x="1190" y="363" text-anchor="middle">3</text><text x="1320" y="363" text-anchor="end">30</text>
 <rect x="101" y="379" width="1398" height="46" fill="#173354"/><text x="143" y="409">Zig-zag mechanism</text><text x="1190" y="409" text-anchor="middle">3</text><text x="1320" y="409" text-anchor="end">90</text>
 <rect x="101" y="425" width="1398" height="46" fill="#132c4b"/><text x="143" y="455">Slave syringes</text><text x="1190" y="455" text-anchor="middle">3</text><text x="1320" y="455" text-anchor="end">90</text>
 <rect x="101" y="471" width="1398" height="46" fill="#173354"/><text x="143" y="501">Hydraulic tubing + manifold + connectors</text><text x="1190" y="501" text-anchor="middle">—</text><text x="1320" y="501" text-anchor="end">200</text>
 <rect x="101" y="517" width="1398" height="46" fill="#132c4b"/><text x="143" y="547">Master syringe</text><text x="1190" y="547" text-anchor="middle">1</text><text x="1320" y="547" text-anchor="end">30</text>
 <rect x="101" y="563" width="1398" height="46" fill="#173354"/><text x="143" y="593">DC motor</text><text x="1190" y="593" text-anchor="middle">1</text><text x="1320" y="593" text-anchor="end">150</text>
 <rect x="101" y="609" width="1398" height="46" fill="#132c4b"/><text x="143" y="639">ESP32</text><text x="1190" y="639" text-anchor="middle">1</text><text x="1320" y="639" text-anchor="end">200</text>
 <rect x="101" y="655" width="1398" height="46" fill="#173354"/><text x="143" y="685">Lead screw + coupling</text><text x="1190" y="685" text-anchor="middle">—</text><text x="1320" y="685" text-anchor="end">100</text>
 <rect x="101" y="701" width="1398" height="46" fill="#132c4b"/><text x="143" y="731">Wiring, mounts, fasteners, etc.</text><text x="1190" y="731" text-anchor="middle">—</text><text x="1320" y="731" text-anchor="end">100</text>
 <rect x="101" y="747" width="1398" height="46" fill="#173354"/><text x="143" y="777">Motor driver + limit switches</text><text x="1190" y="777" text-anchor="middle">—</text><text x="1320" y="777" text-anchor="end">100</text>
</g>
<!-- total row -->
<path d="M100 793 H1500 V832 Q1500 851 1481 851 H119 Q100 851 100 832Z" fill="#dceaf3"/>
<rect x="100" y="793" width="7" height="58" fill="#54d7c6"/>
<text x="143" y="830" class="sans" font-size="21" font-weight="700" fill="#102644">TOTAL</text>
<text x="1320" y="830" class="sans" font-size="24" font-weight="700" fill="#102644" text-anchor="end">₹1,090</text>
</svg>
